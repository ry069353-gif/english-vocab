<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Offline | English Vocab</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: linear-gradient(135deg, #1e3a8a 0%, #312e81 50%, #4c1d95 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }
  .container {
    text-align: center;
    max-width: 600px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 50px 40px;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }
  .icon {
    width: 100px;
    height: 100px;
    background: rgba(239, 68, 68, 0.2);
    border: 3px solid rgba(239, 68, 68, 0.5);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 30px;
    font-size: 50px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
  }
  h1 {
    font-size: 36px;
    margin-bottom: 16px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 18px;
    opacity: 0.85;
    margin-bottom: 30px;
    line-height: 1.5;
  }
  .message {
    background: rgba(0, 0, 0, 0.2);
    border-left: 4px solid #60a5fa;
    padding: 16px 20px;
    border-radius: 8px;
    margin: 24px 0;
    text-align: left;
    font-size: 15px;
    line-height: 1.6;
  }
  .message strong { color: #93c5fd; }
  .info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 30px;
    font-size: 14px;
    opacity: 0.7;
  }
  .dot {
    width: 8px;
    height: 8px;
    background: #ef4444;
    border-radius: 50%;
    animation: blink 1.5s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .footer {
    margin-top: 30px;
    font-size: 13px;
    opacity: 0.5;
  }
  @media (max-width: 480px) {
    .container { padding: 40px 24px; }
    h1 { font-size: 28px; }
    .subtitle { font-size: 16px; }
    .icon { width: 80px; height: 80px; font-size: 40px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">🔒</div>
    <h1>Site Offline</h1>
    <p class="subtitle">यह वेबसाइट अभी बंद है।</p>
    <p class="subtitle" style="font-size: 16px; opacity: 0.7; margin-top: -10px;">This website is currently offline.</p>
    <div class="message">
      <strong>📢 Notice:</strong><br>
      The site has been temporarily taken offline by the owner.
      <br><br>
      <strong>सूचना:</strong> साइट को मालिक द्वारा अस्थायी रूप से बंद कर दिया गया है।
    </div>
    <div class="info">
      <span class="dot"></span>
      <span>Status: Offline</span>
    </div>
    <div class="footer">© English Vocab — Site Owner</div>
  </div>
</body>
</html>
